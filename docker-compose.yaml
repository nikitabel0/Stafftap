services:
  db:
    image: postgres:17
    container_name: stafftap-db
    ports:
      - "5433:5432"
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d   
      - ./postgres/data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./stafftap-backend
      dockerfile: Dockerfile
    container_name: stafftap-backend
    env_file:
      - ./stafftap-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./stafftap-backend/alembic:/app/alembic   # ← alembic migrations
      
  frontend:
    build:
      context: ./stafftap
      dockerfile: Dockerfile
    container_name: stafftap-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"      

  bot:
    build:
      context: ./stafftap-bot
      dockerfile: Dockerfile
    container_name: stafftap-bot
    env_file:
      - ./stafftap-bot/.env
    depends_on:
      - backend
      - db
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: stafftap-docker-nginx-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:ro
      - ./stafftap/build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: stafftap-docker-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw

volumes:
  certbot_www:
  certbot_conf: