services:
  db:
    image: postgres:17
    container_name: stafftap-db
    ports:
      - "5433:5432"
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d   
      - ./postgres/data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./stafftap-backend
      dockerfile: Dockerfile
    container_name: stafftap-backend
    env_file:
      - ./stafftap-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./stafftap
      dockerfile: Dockerfile
    container_name: stafftap-frontend
    # env_file:
    #   - ./stafftap/.env
    depends_on:
      - backend
    volumes:
      - ./stafftap/build:/usr/share/nginx/html:ro
    ports:
      - "3000:3000"
      
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - stafftap-docker_certbot-etc:/etc/letsencrypt:ro
      - ./stafftap/build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  stafftap-docker_certbot-etc:
    external: true