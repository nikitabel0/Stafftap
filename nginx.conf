user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
    access_log   /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Proxy headers для всех проксированных запросов
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;

    ##############################################
    # 1) HTTP → HTTPS + ACME challenge
    server {
        listen       80;
        listen       [::]:80;
        server_name  staffup.online www.staffup.online;

        # Let’s Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное — редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##############################################
    # 2) HTTPS: статика React + прокси API
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  staffup.online www.staffup.online;

        # SSL-сертификаты
        ssl_certificate     /etc/letsencrypt/live/staffup.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staffup.online/privkey.pem;

        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers   on;
        ssl_session_cache           shared:SSL:10m;
        ssl_session_timeout         1h;

        # 2.1) Статика React SPA
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2.2) Проксирование запросов к API
        location /api/ {
            proxy_pass http://stafftap-backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            # остальные proxy_set_header уже заданы в http {}
        }

        # 2.3) Опционально: отдавать favicon и другие статические ресурсы напрямую
        location = /favicon.ico { access_log off; log_not_found off; }
        location ~* \.(?:css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            root /usr/share/nginx/html;
            access_log off;
            expires 30d;
        }
    }
}
